<div class="dashboard-container">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Initiate Transaction</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Account ID</mat-label>
          <input matInput formControlName="accountId">
        </mat-form-field>

        <div class="row">
          <mat-form-field appearance="outline">
            <mat-label>Amount</mat-label>
            <input matInput type="number" formControlName="amount">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Currency</mat-label>
            <mat-select formControlName="currency">
              <mat-option value="USD">USD</mat-option>
              <mat-option value="EUR">EUR</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Reference ID</mat-label>
          <input matInput formControlName="referenceId">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading()" class="full-width">
          <mat-spinner diameter="20" *ngIf="isLoading()"></mat-spinner>
          <span *ngIf="!isLoading()">Process Transaction</span>
        </button>

      </form>
    </mat-card-content>
  </mat-card>

  <mat-card class="feed-card">
    <mat-card-header>
      <mat-card-title>Live Feed</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="transaction-list">
        <div *ngFor="let txn of recentTransactions()" class="txn-item" [class.rejected]="txn.status === 'REJECTED'">
          <div class="txn-header">
            <span class="txn-id">{{ txn.id | slice:0:8 }}...</span>
            <span class="txn-status">{{ txn.status }}</span>
          </div>
          <div class="txn-time">{{ txn.createdAt | date:'mediumTime' }}</div>
        </div>
        <div *ngIf="recentTransactions().length === 0" class="empty-state">
          No transactions yet.
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
