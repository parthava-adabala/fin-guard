name: FinGuard CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build All Services
        run: mvn clean package -DskipTests

      - name: Run Unit Tests
        run: mvn test -pl backend/transaction-engine

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Transaction Engine Image
        uses: docker/build-push-action@v5
        with:
          context: backend/transaction-engine
          push: false
          tags: finguard/transaction-engine:latest

      - name: Build Fraud Sentinel Image
        uses: docker/build-push-action@v5
        with:
          context: backend/fraud-sentinel
          push: false
          tags: finguard/fraud-sentinel:latest

      - name: Build Analytics Service Image
        uses: docker/build-push-action@v5
        with:
          context: backend/analytics-service
          push: false
          tags: finguard/analytics-service:latest