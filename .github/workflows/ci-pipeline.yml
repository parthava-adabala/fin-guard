name: FinGuard CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Shared Library (Proto Common)
        run: mvn clean install -pl backend/proto-common -am -DskipTests

      - name: Run Unit Tests (Transaction Engine)
        run: mvn test -pl backend/transaction-engine

      - name: Build All Services (Skip Tests for Speed)
        run: mvn clean package -DskipTests

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/banking-dashboard/package-lock.json

      - name: Install Dependencies
        working-directory: frontend/banking-dashboard
        run: npm install

      - name: Build Angular App
        working-directory: frontend/banking-dashboard
        run: npm run build -- --configuration=production

  docker-publish:
    runs-on: ubuntu-latest
    needs: [ backend-build, frontend-build ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Transaction Engine
        uses: docker/build-push-action@v5
        with:
          context: backend/transaction-engine
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/transaction-engine:latest

      - name: Build and Push Fraud Sentinel
        uses: docker/build-push-action@v5
        with:
          context: backend/fraud-sentinel
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fraud-sentinel:latest

      - name: Build and Push Analytics Service
        uses: docker/build-push-action@v5
        with:
          context: backend/analytics-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest